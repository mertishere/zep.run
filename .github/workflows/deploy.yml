name: Deploy Web to Docker

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build . -t zep:workflow

      - name: Log into registry
        run: echo ${{ secrets.GHCR_PAT_TOKEN }} | docker login ghcr.io -u ${{ secrets.USERNAME }} --password-stdin

      - name: Tag docker to repo
        run: docker tag zep:workflow gchr.io/zep/zep:api

      - name: Push docker to repo
        run: docker push gchr.io/zep/zep:api
